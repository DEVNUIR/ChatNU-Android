name: Flutter migration

on:
  push:
    paths:
      - "flutter/**"
      - ".github/workflows/flutter-phase1.yml"
  pull_request:
    paths:
      - "flutter/**"
      - ".github/workflows/flutter-phase1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true
      - name: Canonicalize Phase 5 sources
        if: github.event_name == 'push' && github.ref_name == 'chatgpt/phase-5-accessibility-desktop-polish'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/messages/presentation/widgets/message_composer.dart')
          text = path.read_text()
          old = """    return AnimatedContainer(
      duration: ChatNuMotion.micro,
      constraints: const BoxConstraints(minHeight: 46),"""
          new = """    return AnimatedContainer(
      duration: MediaQuery.disableAnimationsOf(context)
          ? Duration.zero
          : ChatNuMotion.micro,
      constraints: const BoxConstraints(
        minHeight: ChatNuSizing.minTouchTarget,
      ),"""
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('recording status target snippet not found')

          old = """    return IconButton(
      tooltip: tooltip,
      onPressed: onPressed,
      visualDensity: VisualDensity.compact,
      constraints: const BoxConstraints.tightFor(width: 38, height: 38),
      style: IconButton.styleFrom(
        foregroundColor: foreground,
        backgroundColor: background,
      ),"""
          new = """    return IconButton(
      tooltip: tooltip,
      onPressed: onPressed,
      style: IconButton.styleFrom(
        minimumSize: const Size.square(ChatNuSizing.minTouchTarget),
        tapTargetSize: MaterialTapTargetSize.padded,
        foregroundColor: foreground,
        backgroundColor: background,
      ),"""
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('recording action target snippet not found')
          path.write_text(text)
          PY
          dart format lib test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          if ! git diff --cached --quiet; then
            git commit -m "style(flutter): canonicalize phase5 polish"
            git push origin HEAD:chatgpt/phase-5-accessibility-desktop-polish
          fi
      - name: Bootstrap Android platform
        run: ./tool/bootstrap_android.sh
      - name: Verify ChatNU Android identity
        run: |
          grep -q 'applicationId = "ir.devnu.chatnu"' android/app/build.gradle.kts
          grep -q 'android:label="ChatNU"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:icon="@drawable/ic_chatnu"' android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/res/drawable/ic_chatnu.xml
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test
      - name: Prepare ChatNU release signing when configured
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && \
             [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && \
             [ -n "$ANDROID_KEY_ALIAS" ] && \
             [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/chatnu-release.jks"
            chmod 600 "$RUNNER_TEMP/chatnu-release.jks"
            echo "production=true" >> "$GITHUB_OUTPUT"
            echo "Using configured ChatNU production signing key."
          else
            echo "production=false" >> "$GITHUB_OUTPUT"
            echo "Production signing secrets are unavailable; building release mode with Flutter's fallback Android signing."
          fi
      - name: Build Android release APK
        env:
          CHATNU_KEYSTORE_PATH: ${{ steps.signing.outputs.production == 'true' && format('{0}/chatnu-release.jks', runner.temp) || '' }}
          CHATNU_KEYSTORE_PASSWORD: ${{ steps.signing.outputs.production == 'true' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          CHATNU_KEY_ALIAS: ${{ steps.signing.outputs.production == 'true' && secrets.ANDROID_KEY_ALIAS || '' }}
          CHATNU_KEY_PASSWORD: ${{ steps.signing.outputs.production == 'true' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: flutter build apk --release
      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk
      - name: Record signing mode
        run: |
          if [ "${{ steps.signing.outputs.production }}" = "true" ]; then
            printf '%s\n' 'production-signed' > ChatNU-signing-mode.txt
          else
            printf '%s\n' 'fallback-signed-not-in-place-upgrade-compatible' > ChatNU-signing-mode.txt
          fi
      - name: Stage ChatNU APK
        run: cp build/app/outputs/flutter-apk/app-release.apk ChatNU-1.2.0-release.apk
      - name: Upload ChatNU release APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatNU-Flutter-Android-APK
          path: |
            flutter/ChatNU-1.2.0-release.apk
            flutter/ChatNU-signing-mode.txt
          if-no-files-found: error
          retention-days: 30