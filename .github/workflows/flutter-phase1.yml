name: Flutter Phase 2

on:
  push:
    paths:
      - "flutter/**"
      - ".github/workflows/flutter-phase1.yml"
  pull_request:
    paths:
      - "flutter/**"
      - ".github/workflows/flutter-phase1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true
      - name: Bootstrap Android platform
        run: ./tool/bootstrap_android.sh
      - name: Normalize formatting
        run: dart format lib test
      - name: Commit normalized Dart sources
        if: github.event_name == 'push'
        working-directory: .
        run: |
          if git diff --quiet -- flutter/lib flutter/test; then
            exit 0
          fi
          git config user.name "ChatNU CI"
          git config user.email "ci@chatnu.invalid"
          git add flutter/lib flutter/test
          git commit -m "Normalize Flutter messenger sources"
          git push
      - name: Analyze
        id: analyze
        shell: bash
        run: |
          set +e
          flutter analyze --fatal-infos 2>&1 | tee /tmp/chatnu-analyze.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "# Flutter validation"
              echo
              echo "Analyzer output from the latest migration check:"
              echo
              echo '```text'
              cat /tmp/chatnu-analyze.log
              echo '```'
            } > VALIDATION.md
          fi
          exit "$status"
      - name: Commit analyzer diagnostics
        if: failure() && github.event_name == 'push'
        working-directory: .
        run: |
          if [ ! -f flutter/VALIDATION.md ]; then
            exit 0
          fi
          git config user.name "ChatNU CI"
          git config user.email "ci@chatnu.invalid"
          git add flutter/VALIDATION.md
          git commit -m "Record Flutter analyzer diagnostics"
          git push
      - name: Test
        run: flutter test
      - name: Build Android debug APK
        run: flutter build apk --debug
