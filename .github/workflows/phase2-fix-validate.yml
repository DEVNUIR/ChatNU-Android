name: Phase 2 fix validate

on:
  push:
    branches:
      - chatgpt/phase-2-media-recording

permissions:
  contents: write

jobs:
  fix-analyze-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/phase-2-media-recording
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true
      - name: Bootstrap Android platform
        working-directory: flutter
        run: ./tool/bootstrap_android.sh
      - name: Remove dead migration getter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('flutter/lib/features/messages/presentation/widgets/message_composer.dart')
          text = path.read_text()
          old = """  bool get _capturing =>\n      _recordingSession.phase == ChatNuRecordingPhase.holding ||\n      _recordingSession.phase == ChatNuRecordingPhase.locked;\n"""
          if old not in text:
              raise SystemExit('unused _capturing getter not found')
          path.write_text(text.replace(old, '', 1))
          PY
      - name: Resolve dependencies
        working-directory: flutter
        run: flutter pub get
      - name: Format
        working-directory: flutter
        run: dart format lib test
      - name: Commit cleanup
        run: |
          if git diff --quiet -- flutter/lib flutter/test flutter/pubspec.lock; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter/lib flutter/test flutter/pubspec.lock
          git commit -m "fix: remove dead phase2 recorder state"
          git push origin HEAD:chatgpt/phase-2-media-recording
      - name: Analyze
        working-directory: flutter
        run: flutter analyze --fatal-infos
      - name: Test
        working-directory: flutter
        run: flutter test
