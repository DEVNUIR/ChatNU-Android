name: Cleanup old branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-old-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Delete obsolete branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'backup/flutter-first-reset-2026-08-29'
            'backup/pre-cleanup-chatnu'
            'feat/flutter-liquid-glass-phase1'
            'feat/flutter-messenger-full-stack'
            'feat/flutter-messenger-phase2'
            'refactor/flutter-liquid-glass-2026'
            'refactor/settings-media-glass-v2'
            'restore-chatnu-temp'
            'restore-chatnu-temp-2'
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            else
              echo "Already absent: $branch"
            fi
          done

      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/cleanup-old-branches.yml
          git commit -m 'chore: remove one-shot branch cleanup workflow'
          git push origin HEAD:main
