server {
    listen 80;
    server_name chatnu.devnu.ir;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name chatnu.devnu.ir;

    ssl_certificate /etc/letsencrypt/live/chatnu.devnu.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chatnu.devnu.ir/privkey.pem;

    client_max_body_size 26m;

    location /realtime {
        proxy_pass http://127.0.0.1:8081/realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 75s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
