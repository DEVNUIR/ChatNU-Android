name: Phase 0 analyzer fixer

on:
  push:
    branches:
      - chatgpt/phase-0-reliability

permissions:
  contents: write

jobs:
  fix-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/phase-0-reliability
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true
      - name: Bootstrap Android platform
        run: ./tool/bootstrap_android.sh
      - name: Apply analyzer fixes
        working-directory: .
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "flutter/lib/features/home/application/demo_messenger_controller.dart",
              "import 'package:chatnu/features/home/data/messenger_local_store.dart';\n",
              "",
          )
          replace(
              "flutter/lib/features/home/application/demo_messenger_controller.dart",
              "    if (target == null || message.sentAt.isBefore(target.lastActivityAt))\n      return;\n",
              "    if (target == null || message.sentAt.isBefore(target.lastActivityAt)) {\n      return;\n    }\n",
          )
          replace(
              "flutter/lib/features/home/data/messenger_local_store.dart",
              "import 'package:sqflite/sqflite.dart';\n",
              "",
          )
          replace(
              "flutter/lib/features/home/data/messenger_local_store.dart",
              "  if (value is! Map)\n    throw const FormatException('Expected cached JSON object.');\n",
              "  if (value is! Map) {\n    throw const FormatException('Expected cached JSON object.');\n  }\n",
          )
          replace(
              "flutter/lib/features/home/data/messenger_repository.dart",
              "import 'dart:collection';\n",
              "",
          )
          replace(
              "flutter/lib/features/home/data/messenger_repository.dart",
              "  final byIdentity = LinkedHashMap<String, ChatNuMessage>();\n",
              "  final byIdentity = <String, ChatNuMessage>{};\n",
          )
          replace(
              "flutter/test/messenger_reliability_test.dart",
              "        overrides: <Override>[\n",
              "        overrides: [\n",
          )
          replace(
              "flutter/test/messenger_reliability_test.dart",
              "  _FakeApiClient({\n    required ChatNuServerEndpoint endpoint,\n    required CredentialVault vault,\n  }) : super(endpoint: endpoint, vault: vault);\n",
              "  _FakeApiClient({required super.endpoint, required super.vault});\n",
          )
          PY
      - name: Format
        run: dart format lib test
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Commit analyzer fixes
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter/lib flutter/test
          git commit -m "fix: satisfy phase0 Flutter analyzer"
          git push origin HEAD:chatgpt/phase-0-reliability
      - name: Test
        run: flutter test
