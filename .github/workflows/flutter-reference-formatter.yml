name: Flutter reference UI formatter

on:
  push:
    branches:
      - refactor/flutter-liquid-glass-2026
    paths:
      - ".github/workflows/flutter-reference-formatter.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true
      - name: Format Flutter reference UI sources
        run: |
          cd flutter
          dart format lib test
      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter/lib flutter/test
          if ! git diff --cached --quiet; then
            git commit -m "style(flutter): apply reference UI formatting"
            git push
          fi
