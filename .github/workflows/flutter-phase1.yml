name: Flutter Phase 2

on:
  push:
    paths:
      - "flutter/**"
      - ".github/workflows/flutter-phase1.yml"
  pull_request:
    paths:
      - "flutter/**"
      - ".github/workflows/flutter-phase1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true
      - name: Bootstrap Android platform
        run: ./tool/bootstrap_android.sh
      - name: Normalize formatting
        run: dart format lib test
      - name: Commit normalized Dart sources
        if: github.event_name == 'push'
        working-directory: .
        run: |
          if git diff --quiet -- flutter/lib flutter/test; then
            exit 0
          fi
          git config user.name "ChatNU CI"
          git config user.email "ci@chatnu.invalid"
          git add flutter/lib flutter/test
          git commit -m "Normalize Flutter messenger sources"
          git push
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test
      - name: Build Android debug APK
        run: flutter build apk --debug
