services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatnu
      POSTGRES_USER: chatnu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatnu-local-password}
    volumes:
      - chatnu_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatnu -d chatnu"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - chatnu_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-chatnu}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-chatnu-local-minio-secret}
    volumes:
      - chatnu_minio:/data
    ports:
      - "127.0.0.1:9001:9001"

  api:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://chatnu:${POSTGRES_PASSWORD:-chatnu-local-password}@postgres:5432/chatnu?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-this-local-jwt-secret-32-chars-minimum}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-chatnu}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-chatnu-local-minio-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-chatnu-attachments}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  chatnu_postgres:
  chatnu_redis:
  chatnu_minio:
