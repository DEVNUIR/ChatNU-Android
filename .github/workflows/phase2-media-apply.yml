name: Phase 2 media apply

on:
  push:
    branches:
      - chatgpt/phase-2-media-recording

permissions:
  contents: write

jobs:
  apply-format-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/phase-2-media-recording
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true
      - name: Bootstrap Android platform
        working-directory: flutter
        run: ./tool/bootstrap_android.sh
      - name: Apply rich media presentation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('flutter/lib/features/messages/presentation/widgets/rich_message_content.dart')
          text = path.read_text()
          import_line = "import 'package:open_file/open_file.dart';\n"
          if import_line not in text:
              text = text.replace(
                  "import 'package:latlong2/latlong.dart';\n",
                  "import 'package:latlong2/latlong.dart';\n" + import_line,
                  1,
              )

          start = text.index('class _EncryptedAudioMessage')
          end = text.index('class _LoadMediaTile')
          block = r'''class _EncryptedAudioMessage extends ConsumerStatefulWidget {
            const _EncryptedAudioMessage({required this.message, required this.mine});

            final ChatNuMessage message;
            final bool mine;

            @override
            ConsumerState<_EncryptedAudioMessage> createState() =>
                _EncryptedAudioMessageState();
          }

          class _EncryptedAudioMessageState
              extends _EncryptedMediaState<_EncryptedAudioMessage> {
            bool _listened = false;

            @override
            Widget build(BuildContext context) {
              final strings = ChatNuStrings.of(context);
              final palette = context.chatNu;
              final foreground = widget.mine ? Colors.black : palette.textPrimary;
              final secondary = widget.mine
                  ? Colors.black.withValues(alpha: 0.58)
                  : palette.textMuted;
              if (tempFile != null) {
                return Container(
                  width: 292,
                  padding: const EdgeInsetsDirectional.fromSTEB(8, 7, 8, 5),
                  decoration: BoxDecoration(
                    borderRadius: BorderRadius.circular(ChatNuRadii.md),
                    color: widget.mine
                        ? Colors.black.withValues(alpha: 0.035)
                        : palette.backgroundElevated.withValues(alpha: 0.42),
                  ),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.stretch,
                    children: <Widget>[
                      Row(
                        children: <Widget>[
                          Icon(
                            widget.message.type == ChatNuMessageType.voice
                                ? Icons.mic_rounded
                                : Icons.audio_file_outlined,
                            size: 15,
                            color: secondary,
                          ),
                          const SizedBox(width: 6),
                          Expanded(
                            child: Text(
                              widget.message.type == ChatNuMessageType.voice
                                  ? (strings.isPersian
                                        ? 'پیام صوتی'
                                        : 'Voice message')
                                  : (widget.message.fileName ??
                                        (strings.isPersian ? 'صدا' : 'Audio')),
                              maxLines: 1,
                              overflow: TextOverflow.ellipsis,
                              style: Theme.of(context).textTheme.labelSmall?.copyWith(
                                color: secondary,
                              ),
                            ),
                          ),
                          AnimatedSwitcher(
                            duration: ChatNuMotion.micro,
                            child: _listened
                                ? Row(
                                    key: const ValueKey<String>('listened'),
                                    mainAxisSize: MainAxisSize.min,
                                    children: <Widget>[
                                      Icon(
                                        Icons.check_circle_outline_rounded,
                                        size: 14,
                                        color: secondary,
                                      ),
                                      const SizedBox(width: 3),
                                      Text(
                                        strings.isPersian ? 'شنیده شد' : 'Listened',
                                        style: Theme.of(context)
                                            .textTheme
                                            .labelSmall
                                            ?.copyWith(color: secondary),
                                      ),
                                    ],
                                  )
                                : const SizedBox.shrink(),
                          ),
                        ],
                      ),
                      AudioPlayerWidget(
                        autoLoad: true,
                        autoPlay: false,
                        audioPath: tempFile!.path,
                        audioType: AudioType.directFile,
                        playerStyle: PlayerStyle.style2,
                        shapeType: PlayIconShapeType.circular,
                        textDirection: Directionality.of(context),
                        width: 276,
                        size: 42,
                        showProgressBar: true,
                        showTimer: true,
                        backgroundColor: Colors.transparent,
                        progressBarColor: foreground,
                        progressBarBackgroundColor: foreground.withValues(alpha: 0.18),
                        iconColor: foreground,
                        audioSpeeds: const <double>[1, 1.5, 2],
                        onPlay: (isPlaying) {
                          if (!isPlaying || _listened || !mounted) return;
                          setState(() => _listened = true);
                        },
                      ),
                    ],
                  ),
                );
              }
              return _LoadMediaTile(
                message: widget.message,
                mine: widget.mine,
                loading: loading,
                error: error,
                icon: Icons.graphic_eq_rounded,
                label: widget.message.type == ChatNuMessageType.voice
                    ? (strings.isPersian
                          ? 'پخش پیام صوتی'
                          : 'Play voice message')
                    : (strings.isPersian ? 'پخش صدا' : 'Play audio'),
                detail: widget.message.mediaDurationMs == null
                    ? _sizeLabel(widget.message.sizeBytes)
                    : _durationLabel(
                        Duration(milliseconds: widget.message.mediaDurationMs!),
                      ),
                onPressed: widget.message.hasAttachment
                    ? () => unawaited(decryptToTemp(widget.message))
                    : null,
              );
            }
          }

          class _EncryptedVideoMessage extends ConsumerStatefulWidget {
            const _EncryptedVideoMessage({required this.message, required this.mine});

            final ChatNuMessage message;
            final bool mine;

            @override
            ConsumerState<_EncryptedVideoMessage> createState() =>
                _EncryptedVideoMessageState();
          }

          class _EncryptedVideoMessageState
              extends _EncryptedMediaState<_EncryptedVideoMessage> {
            VideoPlayerController? _controller;

            Future<void> _load() async {
              final file = await decryptToTemp(widget.message);
              if (file == null || !mounted) return;
              try {
                final controller = VideoPlayerController.file(file);
                await controller.initialize();
                if (!mounted) {
                  await controller.dispose();
                  return;
                }
                controller.addListener(_onTick);
                _controller = controller;
                setState(() {});
              } catch (_) {
                if (!mounted) return;
                setState(() => error = 'Unable to play this video.');
              }
            }

            void _onTick() {
              if (mounted) setState(() {});
            }

            void _togglePlayback() {
              final controller = _controller;
              if (controller == null) return;
              if (controller.value.isPlaying) {
                unawaited(controller.pause());
              } else {
                unawaited(controller.play());
              }
            }

            @override
            void dispose() {
              final controller = _controller;
              if (controller != null) {
                controller.removeListener(_onTick);
                unawaited(controller.dispose());
              }
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              final controller = _controller;
              if (controller != null && controller.value.isInitialized) {
                return widget.message.isVideoNote
                    ? _videoNote(context, controller)
                    : _regularVideo(context, controller);
              }
              return _VideoPosterTile(
                message: widget.message,
                mine: widget.mine,
                loading: loading,
                error: error,
                onPressed: widget.message.hasAttachment
                    ? () => unawaited(_load())
                    : null,
              );
            }

            Widget _videoNote(
              BuildContext context,
              VideoPlayerController controller,
            ) {
              final palette = context.chatNu;
              final value = controller.value;
              final duration = value.duration;
              final progress = duration.inMilliseconds <= 0
                  ? null
                  : (value.position.inMilliseconds / duration.inMilliseconds)
                        .clamp(0.0, 1.0)
                        .toDouble();
              return SizedBox.square(
                dimension: 226,
                child: GestureDetector(
                  onTap: _togglePlayback,
                  child: Stack(
                    alignment: Alignment.center,
                    children: <Widget>[
                      Container(
                        width: 220,
                        height: 220,
                        decoration: BoxDecoration(
                          shape: BoxShape.circle,
                          color: palette.backgroundPrimary,
                          border: Border.all(
                            color: widget.mine
                                ? Colors.black.withValues(alpha: 0.12)
                                : palette.borderSubtle,
                          ),
                        ),
                        clipBehavior: Clip.antiAlias,
                        child: _CoverVideo(controller: controller),
                      ),
                      Positioned.fill(
                        child: Padding(
                          padding: const EdgeInsets.all(1),
                          child: CircularProgressIndicator(
                            value: progress,
                            strokeWidth: 3,
                            backgroundColor: Colors.white.withValues(alpha: 0.16),
                            color: Colors.white.withValues(alpha: 0.86),
                          ),
                        ),
                      ),
                      AnimatedOpacity(
                        opacity: value.isPlaying ? 0 : 1,
                        duration: ChatNuMotion.micro,
                        child: Container(
                          width: 52,
                          height: 52,
                          decoration: BoxDecoration(
                            shape: BoxShape.circle,
                            color: Colors.black.withValues(alpha: 0.48),
                          ),
                          child: const Icon(
                            Icons.play_arrow_rounded,
                            color: Colors.white,
                            size: 31,
                          ),
                        ),
                      ),
                      Positioned(
                        bottom: 16,
                        child: _MediaDurationPill(
                          duration: value.position > Duration.zero
                              ? value.position
                              : value.duration,
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }

            Widget _regularVideo(
              BuildContext context,
              VideoPlayerController controller,
            ) {
              final palette = context.chatNu;
              final aspect = controller.value.aspectRatio == 0
                  ? 16 / 9
                  : controller.value.aspectRatio;
              return ClipRRect(
                borderRadius: BorderRadius.circular(ChatNuRadii.md),
                child: SizedBox(
                  width: 292,
                  child: AspectRatio(
                    aspectRatio: aspect.clamp(0.58, 1.9),
                    child: ColoredBox(
                      color: palette.backgroundPrimary,
                      child: Stack(
                        alignment: Alignment.center,
                        children: <Widget>[
                          Positioned.fill(child: VideoPlayer(controller)),
                          AnimatedOpacity(
                            opacity: controller.value.isPlaying ? 0 : 1,
                            duration: ChatNuMotion.micro,
                            child: IconButton.filledTonal(
                              onPressed: _togglePlayback,
                              icon: const Icon(Icons.play_arrow_rounded),
                            ),
                          ),
                          PositionedDirectional(
                            top: 8,
                            end: 8,
                            child: _MediaDurationPill(
                              duration: controller.value.duration,
                            ),
                          ),
                          Positioned(
                            left: 8,
                            right: 8,
                            bottom: 6,
                            child: VideoProgressIndicator(
                              controller,
                              allowScrubbing: true,
                              padding: const EdgeInsets.symmetric(vertical: 4),
                              colors: VideoProgressColors(
                                playedColor: Colors.white,
                                bufferedColor: Colors.white.withValues(alpha: 0.35),
                                backgroundColor: Colors.black.withValues(alpha: 0.32),
                              ),
                            ),
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          class _VideoPosterTile extends StatelessWidget {
            const _VideoPosterTile({
              required this.message,
              required this.mine,
              required this.loading,
              required this.error,
              required this.onPressed,
            });

            final ChatNuMessage message;
            final bool mine;
            final bool loading;
            final String? error;
            final VoidCallback? onPressed;

            @override
            Widget build(BuildContext context) {
              final palette = context.chatNu;
              final foreground = mine ? Colors.black : palette.textPrimary;
              final secondary = mine
                  ? Colors.black.withValues(alpha: 0.58)
                  : palette.textMuted;
              final duration = message.mediaDurationMs == null
                  ? null
                  : Duration(milliseconds: message.mediaDurationMs!);
              if (message.isVideoNote) {
                return _LoadMediaTile(
                  message: message,
                  mine: mine,
                  loading: loading,
                  error: error,
                  icon: Icons.video_camera_front_outlined,
                  label: ChatNuStrings.of(context).isPersian
                      ? 'پخش ویدیو نوت'
                      : 'Play video message',
                  detail: duration == null ? null : _durationLabel(duration),
                  onPressed: onPressed,
                );
              }
              return SizedBox(
                width: 292,
                child: AspectRatio(
                  aspectRatio: 16 / 9,
                  child: Material(
                    color: Colors.transparent,
                    child: InkWell(
                      onTap: loading ? null : onPressed,
                      borderRadius: BorderRadius.circular(ChatNuRadii.md),
                      child: Ink(
                        decoration: BoxDecoration(
                          borderRadius: BorderRadius.circular(ChatNuRadii.md),
                          color: mine
                              ? Colors.black.withValues(alpha: 0.07)
                              : palette.backgroundElevated.withValues(alpha: 0.62),
                          border: Border.all(
                            color: mine
                                ? Colors.black.withValues(alpha: 0.09)
                                : palette.borderSubtle,
                          ),
                        ),
                        child: Stack(
                          alignment: Alignment.center,
                          children: <Widget>[
                            Positioned.fill(
                              child: Icon(
                                Icons.movie_outlined,
                                size: 72,
                                color: foreground.withValues(alpha: 0.08),
                              ),
                            ),
                            if (loading)
                              CircularProgressIndicator(
                                strokeWidth: 2,
                                color: foreground,
                              )
                            else
                              Container(
                                width: 52,
                                height: 52,
                                decoration: BoxDecoration(
                                  shape: BoxShape.circle,
                                  color: foreground.withValues(alpha: 0.13),
                                ),
                                child: Icon(
                                  Icons.play_arrow_rounded,
                                  color: foreground,
                                  size: 31,
                                ),
                              ),
                            PositionedDirectional(
                              start: 10,
                              end: 10,
                              bottom: 9,
                              child: Row(
                                children: <Widget>[
                                  Expanded(
                                    child: Text(
                                      error ?? message.fileName ?? 'Video',
                                      maxLines: 1,
                                      overflow: TextOverflow.ellipsis,
                                      style: Theme.of(context)
                                          .textTheme
                                          .labelSmall
                                          ?.copyWith(
                                            color: error == null
                                                ? secondary
                                                : palette.destructive,
                                          ),
                                    ),
                                  ),
                                  if (duration != null)
                                    _MediaDurationPill(duration: duration),
                                ],
                              ),
                            ),
                          ],
                        ),
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          class _MediaDurationPill extends StatelessWidget {
            const _MediaDurationPill({required this.duration});

            final Duration duration;

            @override
            Widget build(BuildContext context) {
              return Container(
                padding: const EdgeInsets.symmetric(horizontal: 7, vertical: 3),
                decoration: BoxDecoration(
                  color: Colors.black.withValues(alpha: 0.48),
                  borderRadius: BorderRadius.circular(ChatNuRadii.pill),
                ),
                child: Text(
                  _durationLabel(duration),
                  style: Theme.of(context).textTheme.labelSmall?.copyWith(
                    color: Colors.white,
                    fontFeatures: const <FontFeature>[
                      FontFeature.tabularFigures(),
                    ],
                  ),
                ),
              );
            }
          }

          class _CoverVideo extends StatelessWidget {
            const _CoverVideo({required this.controller});

            final VideoPlayerController controller;

            @override
            Widget build(BuildContext context) {
              final size = controller.value.size;
              if (size.width <= 0 || size.height <= 0) {
                return VideoPlayer(controller);
              }
              return FittedBox(
                fit: BoxFit.cover,
                clipBehavior: Clip.hardEdge,
                child: SizedBox(
                  width: size.width,
                  height: size.height,
                  child: VideoPlayer(controller),
                ),
              );
            }
          }

          class _EncryptedImageMessage extends ConsumerStatefulWidget {
            const _EncryptedImageMessage({required this.message, required this.mine});

            final ChatNuMessage message;
            final bool mine;

            @override
            ConsumerState<_EncryptedImageMessage> createState() =>
                _EncryptedImageMessageState();
          }

          class _EncryptedImageMessageState
              extends ConsumerState<_EncryptedImageMessage> {
            Uint8List? _bytes;
            bool _loading = false;
            String? _error;

            Future<void> _load() async {
              if (_loading) return;
              setState(() {
                _loading = true;
                _error = null;
              });
              final bytes = await ref
                  .read(messengerDemoProvider.notifier)
                  .downloadAttachment(widget.message);
              if (!mounted) return;
              setState(() {
                _loading = false;
                _bytes = bytes;
                _error = bytes == null ? 'Unable to decrypt this image.' : null;
              });
            }

            void _openViewer() {
              final bytes = _bytes;
              if (bytes == null) return;
              Navigator.of(context).push(
                PageRouteBuilder<void>(
                  transitionDuration: MediaQuery.disableAnimationsOf(context)
                      ? Duration.zero
                      : const Duration(milliseconds: 180),
                  reverseTransitionDuration: const Duration(milliseconds: 140),
                  pageBuilder: (context, animation, secondaryAnimation) =>
                      _ImageViewer(
                        bytes: bytes,
                        title: widget.message.fileName ?? 'Image',
                      ),
                  transitionsBuilder: (context, animation, secondaryAnimation, child) =>
                      FadeTransition(opacity: animation, child: child),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              final bytes = _bytes;
              if (bytes != null) {
                return GestureDetector(
                  onTap: _openViewer,
                  child: ClipRRect(
                    borderRadius: BorderRadius.circular(ChatNuRadii.md),
                    child: ConstrainedBox(
                      constraints: const BoxConstraints(
                        maxWidth: 292,
                        maxHeight: 420,
                      ),
                      child: Image.memory(
                        bytes,
                        width: 292,
                        fit: BoxFit.contain,
                        gaplessPlayback: true,
                        filterQuality: FilterQuality.medium,
                        errorBuilder: (context, error, stackTrace) =>
                            const SizedBox(
                              width: 220,
                              height: 120,
                              child: Center(
                                child: Icon(Icons.broken_image_outlined),
                              ),
                            ),
                      ),
                    ),
                  ),
                );
              }
              return _LoadMediaTile(
                message: widget.message,
                mine: widget.mine,
                loading: _loading,
                error: _error,
                icon: Icons.image_outlined,
                label: ChatNuStrings.of(context).isPersian
                    ? 'نمایش تصویر'
                    : 'View image',
                detail: _sizeLabel(widget.message.sizeBytes),
                onPressed: widget.message.hasAttachment
                    ? () => unawaited(_load())
                    : null,
              );
            }
          }

          class _ImageViewer extends StatelessWidget {
            const _ImageViewer({required this.bytes, required this.title});

            final Uint8List bytes;
            final String title;

            @override
            Widget build(BuildContext context) {
              final strings = ChatNuStrings.of(context);
              return Scaffold(
                backgroundColor: Colors.black,
                body: Stack(
                  fit: StackFit.expand,
                  children: <Widget>[
                    SafeArea(
                      child: InteractiveViewer(
                        minScale: 0.8,
                        maxScale: 5,
                        boundaryMargin: const EdgeInsets.all(48),
                        child: Center(
                          child: Image.memory(
                            bytes,
                            fit: BoxFit.contain,
                            filterQuality: FilterQuality.high,
                          ),
                        ),
                      ),
                    ),
                    SafeArea(
                      child: Align(
                        alignment: Alignment.topCenter,
                        child: Padding(
                          padding: const EdgeInsets.all(ChatNuSpacing.sm),
                          child: ConstrainedBox(
                            constraints: const BoxConstraints(maxWidth: 680),
                            child: GlassSurface(
                              variant: GlassVariant.strong,
                              enableBlur: true,
                              borderRadius: ChatNuRadii.xl,
                              padding: const EdgeInsets.all(ChatNuSpacing.xs),
                              child: Row(
                                children: <Widget>[
                                  GlassIconButton(
                                    tooltip: MaterialLocalizations.of(context)
                                        .backButtonTooltip,
                                    onPressed: () => Navigator.of(context).pop(),
                                    icon: Icons.arrow_back_ios_new_rounded,
                                  ),
                                  const SizedBox(width: 8),
                                  Expanded(
                                    child: Text(
                                      title,
                                      maxLines: 1,
                                      overflow: TextOverflow.ellipsis,
                                      style: Theme.of(context)
                                          .textTheme
                                          .titleSmall
                                          ?.copyWith(color: Colors.white),
                                    ),
                                  ),
                                  Padding(
                                    padding: const EdgeInsetsDirectional.only(end: 8),
                                    child: Text(
                                      strings.isPersian
                                          ? 'برای بزرگ‌نمایی حرکت دهید'
                                          : 'Pinch to zoom',
                                      style: Theme.of(context)
                                          .textTheme
                                          .bodySmall
                                          ?.copyWith(color: Colors.white70),
                                    ),
                                  ),
                                ],
                              ),
                            ),
                          ),
                        ),
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class _EncryptedFileMessage extends ConsumerStatefulWidget {
            const _EncryptedFileMessage({required this.message, required this.mine});

            final ChatNuMessage message;
            final bool mine;

            @override
            ConsumerState<_EncryptedFileMessage> createState() =>
                _EncryptedFileMessageState();
          }

          class _EncryptedFileMessageState
              extends _EncryptedMediaState<_EncryptedFileMessage> {
            Future<void> _open() async {
              final file = await decryptToTemp(widget.message);
              if (file == null || !mounted) return;
              await OpenFile.open(file.path, type: widget.message.mimeType);
            }

            Future<void> _save() async {
              File? file = tempFile;
              file ??= await decryptToTemp(widget.message);
              if (file == null || !mounted) return;
              final bytes = await file.readAsBytes();
              if (!mounted) return;
              final strings = ChatNuStrings.of(context);
              final result = await FilePicker.saveFile(
                dialogTitle: strings.attachmentDownload,
                fileName: widget.message.fileName ?? 'attachment',
                bytes: bytes,
              );
              if (!mounted) return;
              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(
                  content: Text(
                    result == null
                        ? strings.saveCancelled
                        : strings.attachmentSaved,
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              final strings = ChatNuStrings.of(context);
              final palette = context.chatNu;
              final foreground = widget.mine ? Colors.black : palette.textPrimary;
              final secondary = widget.mine
                  ? Colors.black.withValues(alpha: 0.58)
                  : palette.textMuted;
              final label = widget.message.fileName ?? widget.message.body;
              return ConstrainedBox(
                constraints: const BoxConstraints(minWidth: 236, maxWidth: 304),
                child: Padding(
                  padding: const EdgeInsets.symmetric(vertical: 2),
                  child: Row(
                    children: <Widget>[
                      Container(
                        width: 48,
                        height: 48,
                        decoration: BoxDecoration(
                          color: widget.mine
                              ? Colors.black.withValues(alpha: 0.08)
                              : palette.backgroundElevated,
                          borderRadius: BorderRadius.circular(14),
                        ),
                        alignment: Alignment.center,
                        child: loading
                            ? SizedBox.square(
                                dimension: 18,
                                child: CircularProgressIndicator(
                                  strokeWidth: 1.8,
                                  color: foreground,
                                ),
                              )
                            : Icon(
                                _fileIcon(widget.message),
                                color: foreground,
                              ),
                      ),
                      const SizedBox(width: 9),
                      Expanded(
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: <Widget>[
                            Text(
                              label,
                              maxLines: 2,
                              overflow: TextOverflow.ellipsis,
                              style: Theme.of(context)
                                  .textTheme
                                  .labelLarge
                                  ?.copyWith(color: foreground),
                            ),
                            const SizedBox(height: 2),
                            Text(
                              error ?? _fileDetail(widget.message),
                              maxLines: 1,
                              overflow: TextOverflow.ellipsis,
                              style: Theme.of(context).textTheme.bodySmall?.copyWith(
                                color: error == null
                                    ? secondary
                                    : palette.destructive,
                              ),
                            ),
                          ],
                        ),
                      ),
                      IconButton(
                        tooltip: strings.isPersian ? 'باز کردن' : 'Open',
                        onPressed: loading || !widget.message.hasAttachment
                            ? null
                            : () => unawaited(_open()),
                        icon: const Icon(Icons.open_in_new_rounded, size: 19),
                      ),
                      IconButton(
                        tooltip: strings.attachmentDownload,
                        onPressed: loading || !widget.message.hasAttachment
                            ? null
                            : () => unawaited(_save()),
                        icon: const Icon(Icons.download_outlined, size: 19),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          IconData _fileIcon(ChatNuMessage message) {
            final mime = message.mimeType?.toLowerCase() ?? '';
            final name = message.fileName?.toLowerCase() ?? '';
            if (mime.contains('pdf') || name.endsWith('.pdf')) {
              return Icons.picture_as_pdf_outlined;
            }
            if (mime.startsWith('audio/')) return Icons.audio_file_outlined;
            if (mime.startsWith('video/')) return Icons.video_file_outlined;
            if (mime.startsWith('image/')) return Icons.image_outlined;
            if (mime.contains('zip') ||
                mime.contains('compressed') ||
                name.endsWith('.zip') ||
                name.endsWith('.rar') ||
                name.endsWith('.7z')) {
              return Icons.folder_zip_outlined;
            }
            if (mime.startsWith('text/') ||
                name.endsWith('.txt') ||
                name.endsWith('.md')) {
              return Icons.description_outlined;
            }
            if (name.endsWith('.doc') || name.endsWith('.docx')) {
              return Icons.article_outlined;
            }
            if (name.endsWith('.xls') || name.endsWith('.xlsx') || name.endsWith('.csv')) {
              return Icons.table_chart_outlined;
            }
            return Icons.insert_drive_file_outlined;
          }

          String _fileDetail(ChatNuMessage message) {
            final name = message.fileName ?? '';
            final dot = name.lastIndexOf('.');
            final extension = dot >= 0 && dot < name.length - 1
                ? name.substring(dot + 1).toUpperCase()
                : null;
            final mime = message.mimeType;
            final type = extension ?? mime ?? 'FILE';
            final size = _sizeLabel(message.sizeBytes);
            return size == null ? type : '$type • $size';
          }

          '''
          text = text[:start] + block + text[end:]
          path.write_text(text)
          PY
