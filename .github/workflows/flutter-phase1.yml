name: Flutter migration

on:
  push:
    paths:
      - "flutter/**"
      - ".github/workflows/flutter-phase1.yml"
  pull_request:
    paths:
      - "flutter/**"
      - ".github/workflows/flutter-phase1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true
      - name: Bootstrap Android platform
        run: ./tool/bootstrap_android.sh
      - name: Verify ChatNU Android identity
        run: |
          grep -q 'applicationId = "ir.devnu.chatnu"' android/app/build.gradle.kts
          grep -q 'android:label="ChatNU"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:icon="@drawable/ic_chatnu"' android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/res/drawable/ic_chatnu.xml
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test
      - name: Prepare ChatNU release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is required" >&2; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD is required" >&2; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS is required" >&2; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD is required" >&2; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/chatnu-release.jks"
          chmod 600 "$RUNNER_TEMP/chatnu-release.jks"
      - name: Build signed Android release APK
        env:
          CHATNU_KEYSTORE_PATH: ${{ runner.temp }}/chatnu-release.jks
          CHATNU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CHATNU_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CHATNU_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release
      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk
      - name: Stage ChatNU APK
        run: cp build/app/outputs/flutter-apk/app-release.apk ChatNU-1.2.0-release.apk
      - name: Upload ChatNU release APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatNU-Flutter-Android-APK
          path: flutter/ChatNU-1.2.0-release.apk
          if-no-files-found: error
          retention-days: 30
