name: Phase 3 formatter commit

on:
  push:
    branches:
      - chatgpt/phase-3-location-calls

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/phase-3-location-calls
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true
      - name: Canonically format Phase 3 Dart
        working-directory: flutter
        run: dart format lib test
      - name: Commit formatter output
        run: |
          if git diff --quiet -- flutter/lib flutter/test; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter/lib flutter/test
          git commit -m "chore: apply canonical Dart formatting"
          git push origin HEAD:chatgpt/phase-3-location-calls
