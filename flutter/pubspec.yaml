publish_to: "none"
version: 1.2.0+4

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  dio: ^5.11.0
  file_picker: ^12.1.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
