name: Apply recorder UX polish

on:
  push:
    branches:
      - chatgpt/ux-recorder-blue-polish
    paths:
      - ".github/workflows/ux-recorder-polish-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ux-recorder-blue-polish
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true
      - name: Preserve recorder gesture and repair device identity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          composer = Path('flutter/lib/features/messages/presentation/widgets/message_composer.dart')
          text = composer.read_text()
          needle = 'enabled && !recording'
          if text.count(needle) != 3:
              raise SystemExit(f'expected 3 recorder callback guards, got {text.count(needle)}')
          composer.write_text(text.replace(needle, 'enabled'))

          repository = Path('flutter/lib/features/home/data/messenger_repository.dart')
          text = repository.read_text()
          old_guard = "    if (session == null || !keys.missingUserIds.contains(session.user.id)) {\n      return keys;\n    }\n\n"
          new_guard = "    if (session == null) return keys;\n\n    bool currentDeviceIsMissing(ConversationKeysResponse value) =>\n        !value.devices.any((device) => device.deviceId == session.deviceId);\n\n    final shouldRepair =\n        currentDeviceIsMissing(keys) ||\n        keys.missingUserIds.contains(session.user.id);\n    if (!shouldRepair) return keys;\n\n"
          if text.count(old_guard) != 1:
              raise SystemExit(f'expected one E2EE guard, got {text.count(old_guard)}')
          text = text.replace(old_guard, new_guard, 1)
          old_retry = "    keys = await _api.conversationKeys(conversationId);\n    return keys;\n"
          new_retry = "    keys = await _api.conversationKeys(conversationId);\n    if (currentDeviceIsMissing(keys)) {\n      throw StateError(\n        'This device could not register its encryption identity. Reconnect or sign in again before sending encrypted messages.',\n      );\n    }\n    return keys;\n"
          if text.count(old_retry) != 1:
              raise SystemExit(f'expected one E2EE retry return, got {text.count(old_retry)}')
          repository.write_text(text.replace(old_retry, new_retry, 1))
          PY
          cd flutter
          dart format lib/features/messages/presentation/widgets/message_composer.dart lib/features/home/data/messenger_repository.dart
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "ChatNU Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add flutter/lib/features/messages/presentation/widgets/message_composer.dart flutter/lib/features/home/data/messenger_repository.dart
          git diff --cached --quiet && exit 0
          git commit -m "fix(flutter): preserve recorder gesture and repair device E2EE identity"
          git push origin HEAD:chatgpt/ux-recorder-blue-polish
