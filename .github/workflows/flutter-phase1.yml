name: Flutter migration

on:
  push:
    paths:
      - "flutter/**"
      - "app/src/main/res/**"
      - ".github/workflows/flutter-phase1.yml"
  pull_request:
    paths:
      - "flutter/**"
      - "app/src/main/res/**"
      - ".github/workflows/flutter-phase1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true
      - name: Bootstrap Android platform
        run: ./tool/bootstrap_android.sh
      - name: Verify ChatNU Android identity
        run: |
          grep -q 'applicationId = "ir.devnu.chatnu"' android/app/build.gradle.kts
          grep -q 'android:label="ChatNU"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f android/app/src/main/res/drawable-xxxhdpi/chatnu_launcher_foreground.webp
          cmp ../app/src/main/res/mipmap-xxxhdpi/ic_launcher.webp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.webp
          cmp ../app/src/main/res/drawable-xxxhdpi/chatnu_launcher_foreground.webp android/app/src/main/res/drawable-xxxhdpi/chatnu_launcher_foreground.webp
          python3 - <<'PY'
          from pathlib import Path

          assets = {
              Path('assets/brand/chatnu_launcher.png'): (b'\x89PNG\r\n\x1a\n', 300_000),
              Path('assets/brand/chatnu_mark.png'): (b'\x89PNG\r\n\x1a\n', 300_000),
              Path('../app/src/main/res/drawable-xxxhdpi/chatnu_launcher_foreground.webp'): (b'RIFF', 4_000),
          }
          for density in ('mdpi', 'hdpi', 'xhdpi', 'xxhdpi', 'xxxhdpi'):
              for name in ('ic_launcher.webp', 'ic_launcher_round.webp'):
                  assets[Path(f'../app/src/main/res/mipmap-{density}/{name}')] = (b'RIFF', 500)
          for path, (signature, minimum_size) in assets.items():
              data = path.read_bytes()
              assert len(data) > minimum_size, f'{path} is unexpectedly truncated'
              assert data.startswith(signature), f'{path} has an invalid signature'
              if path.suffix == '.webp':
                  assert data[8:12] == b'WEBP', f'{path} is not a valid WebP container'

          fonts = list(Path('assets/fonts').glob('*.ttf'))
          assert len(fonts) == 9, 'Expected all nine bundled font weights'
          for path in fonts:
              data = path.read_bytes()
              assert len(data) > 80_000, f'{path} is unexpectedly truncated'
              assert data[:4] in (b'\x00\x01\x00\x00', b'OTTO', b'true'), f'{path} is not a valid font'
          PY
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test
      - name: Prepare ChatNU release signing when configured
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && \
             [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && \
             [ -n "$ANDROID_KEY_ALIAS" ] && \
             [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/chatnu-release.jks"
            chmod 600 "$RUNNER_TEMP/chatnu-release.jks"
            echo "production=true" >> "$GITHUB_OUTPUT"
            echo "Using configured ChatNU production signing key."
          else
            echo "production=false" >> "$GITHUB_OUTPUT"
            echo "Production signing secrets are unavailable; building release mode with Flutter's fallback Android signing."
          fi
      - name: Build Android release APK
        env:
          CHATNU_KEYSTORE_PATH: ${{ steps.signing.outputs.production == 'true' && format('{0}/chatnu-release.jks', runner.temp) || '' }}
          CHATNU_KEYSTORE_PASSWORD: ${{ steps.signing.outputs.production == 'true' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          CHATNU_KEY_ALIAS: ${{ steps.signing.outputs.production == 'true' && secrets.ANDROID_KEY_ALIAS || '' }}
          CHATNU_KEY_PASSWORD: ${{ steps.signing.outputs.production == 'true' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: flutter build apk --release
      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk
      - name: Record signing mode
        run: |
          if [ "${{ steps.signing.outputs.production }}" = "true" ]; then
            printf '%s\n' 'production-signed' > ChatNU-signing-mode.txt
          else
            printf '%s\n' 'fallback-signed-not-in-place-upgrade-compatible' > ChatNU-signing-mode.txt
          fi
      - name: Stage ChatNU APK
        run: cp build/app/outputs/flutter-apk/app-release.apk ChatNU-1.2.1-release.apk
      - name: Upload ChatNU release APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatNU-Flutter-Android-APK
          path: |
            flutter/ChatNU-1.2.1-release.apk
            flutter/ChatNU-signing-mode.txt
          if-no-files-found: error
          retention-days: 30
