name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ["feature/chatnu-ios-redesign"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Generate and retain the Gradle wrapper
        shell: bash
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.13 --distribution-type bin
            git config user.name "DEVNU Build Bot"
            git config user.email "devnu@devnu.ir"
            git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
            if ! git diff --cached --quiet; then
              git commit -m "Add complete Gradle wrapper"
              git push origin HEAD:${GITHUB_REF_NAME}
            fi
          fi
      - run: chmod +x gradlew
      - name: Verify Android client
        run: ./gradlew lint testDebugUnitTest assembleDebug --stacktrace --no-daemon
