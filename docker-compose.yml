services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatnu
      POSTGRES_USER: chatnu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatnu-local-password}
    volumes:
      - chatnu_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatnu -d chatnu"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - chatnu_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://chatnu:${POSTGRES_PASSWORD:-chatnu-local-password}@postgres:5432/chatnu?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-this-local-jwt-secret-32-chars-minimum}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      ATTACHMENT_DIR: /data/attachments
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - chatnu_attachments:/data/attachments
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  chatnu_postgres:
  chatnu_redis:
  chatnu_attachments:
