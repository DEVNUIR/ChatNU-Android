name: V2 UI validate one-shot

on:
  push:
    branches:
      - refactor/settings-media-glass-v2
    paths:
      - ".github/workflows/v2-ui-validate-one-shot.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true
      - name: Apply UI transforms
        run: python3 flutter/tool/apply_v2_ui_transforms.py
      - name: Resolve dependencies
        working-directory: flutter
        run: flutter pub get
      - name: Format Flutter
        working-directory: flutter
        run: dart format lib test
      - name: Bootstrap Android
        working-directory: flutter
        run: ./tool/bootstrap_android.sh
      - name: Analyze Flutter
        working-directory: flutter
        run: flutter analyze --fatal-infos
      - name: Test Flutter
        working-directory: flutter
        run: flutter test
      - name: Commit validated transforms
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm flutter/tool/apply_v2_ui_transforms.py .github/workflows/v2-ui-validate-one-shot.yml
          git add flutter/lib flutter/pubspec.lock
          git commit -m "feat(flutter): refactor settings media contacts and call controls"
          git push
