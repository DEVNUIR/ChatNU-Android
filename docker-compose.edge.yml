services:
  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${CHATNU_EDGE_BIND_ADDRESS:-0.0.0.0}:${CHATNU_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/emergency.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/tls:/etc/nginx/tls:ro
