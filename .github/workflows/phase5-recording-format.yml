name: Phase 5 recording and format

on:
  push:
    branches:
      - chatgpt/phase-5-accessibility-desktop-polish

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Patch recording controls and add focused tests
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('flutter/lib/features/messages/presentation/widgets/message_composer.dart')
          text = path.read_text()
          old = """    return AnimatedContainer(\n      duration: ChatNuMotion.micro,\n      constraints: const BoxConstraints(minHeight: 46),"""
          new = """    return AnimatedContainer(\n      duration: MediaQuery.disableAnimationsOf(context)\n          ? Duration.zero\n          : ChatNuMotion.micro,\n      constraints: const BoxConstraints(\n        minHeight: ChatNuSizing.minTouchTarget,\n      ),"""
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('recording status target snippet not found')

          old = """    return IconButton(\n      tooltip: tooltip,\n      onPressed: onPressed,\n      visualDensity: VisualDensity.compact,\n      constraints: const BoxConstraints.tightFor(width: 38, height: 38),\n      style: IconButton.styleFrom(\n        foregroundColor: foreground,\n        backgroundColor: background,\n      ),"""
          new = """    return IconButton(\n      tooltip: tooltip,\n      onPressed: onPressed,\n      style: IconButton.styleFrom(\n        minimumSize: const Size.square(ChatNuSizing.minTouchTarget),\n        tapTargetSize: MaterialTapTargetSize.padded,\n        foregroundColor: foreground,\n        backgroundColor: background,\n      ),"""
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('recording action target snippet not found')
          path.write_text(text)

          Path('flutter/test/phase5_accessibility_desktop_test.dart').write_text(r'''import 'dart:ui';

import 'package:chatnu/app/chatnu_app.dart';
import 'package:chatnu/core/di/app_providers.dart';
import 'package:chatnu/core/glass/glass_components.dart';
import 'package:chatnu/core/theme/chatnu_theme.dart';
import 'package:chatnu/core/theme/chatnu_tokens.dart';
import 'package:flutter/gestures.dart';
import 'package:flutter/material.dart';
import 'package:flutter/services.dart';
import 'package:flutter_riverpod/flutter_riverpod.dart';
import 'package:flutter_test/flutter_test.dart';

void main() {
  Future<void> useViewport(WidgetTester tester, Size size) async {
    tester.view
      ..physicalSize = size
      ..devicePixelRatio = 1;
    addTearDown(() {
      tester.view.resetPhysicalSize();
      tester.view.resetDevicePixelRatio();
    });
  }

  Widget demoApp() => ProviderScope(
    overrides: [appModeProvider.overrideWithValue(ChatNuAppMode.demo)],
    child: const ChatNuApp(),
  );

  testWidgets('shared interactive controls keep a 48dp minimum target', (
    tester,
  ) async {
    await tester.pumpWidget(
      MaterialApp(
        theme: ChatNuTheme.light,
        home: Scaffold(
          body: Column(
            mainAxisSize: MainAxisSize.min,
            children: <Widget>[
              GlassButton(label: 'Continue', onPressed: () {}),
              GlassSegmentedControl<int>(
                value: 0,
                items: const <int, String>{0: 'All', 1: 'Unread'},
                onChanged: (_) {},
              ),
            ],
          ),
        ),
      ),
    );
    await tester.pumpAndSettle();

    expect(
      tester.getSize(find.byType(GlassButton)).height,
      greaterThanOrEqualTo(ChatNuSizing.minTouchTarget),
    );
    final segment = find.ancestor(
      of: find.text('All'),
      matching: find.byType(InkWell),
    );
    expect(
      tester.getSize(segment.first).height,
      greaterThanOrEqualTo(ChatNuSizing.minTouchTarget),
    );
  });

  testWidgets('GlassButton remains keyboard activatable', (tester) async {
    var activations = 0;
    await tester.pumpWidget(
      MaterialApp(
        theme: ChatNuTheme.light,
        home: Scaffold(
          body: GlassButton(
            label: 'Continue',
            onPressed: () => activations += 1,
          ),
        ),
      ),
    );
    await tester.pump();

    await tester.sendKeyEvent(LogicalKeyboardKey.tab);
    await tester.sendKeyEvent(LogicalKeyboardKey.enter);
    await tester.pump();

    expect(activations, 1);
  });

  testWidgets('desktop secondary click opens anchored conversation menu', (
    tester,
  ) async {
    await useViewport(tester, const Size(1440, 900));
    await tester.pumpWidget(demoApp());
    await tester.pumpAndSettle();

    final designTeam = find.text('Design team').first;
    await tester.tap(designTeam, buttons: kSecondaryMouseButton);
    await tester.pumpAndSettle();

    expect(find.text('Pin'), findsOneWidget);
    expect(find.text('Mute'), findsOneWidget);
    expect(find.byType(BottomSheet), findsNothing);
  });
}
''')
          PY

          dart format \
            flutter/lib/core/theme/chatnu_theme.dart \
            flutter/lib/core/glass/glass_components.dart \
            flutter/lib/features/conversations/presentation/conversation_list_pane.dart \
            flutter/lib/features/home/presentation/messenger_shell.dart \
            flutter/lib/features/messages/presentation/widgets/message_composer.dart \
            flutter/test/phase5_accessibility_desktop_test.dart

          git config user.name 'DEVNU Phase 5 Bot'
          git config user.email 'devnu@devnu.ir'
          git add \
            flutter/lib/core/theme/chatnu_theme.dart \
            flutter/lib/core/glass/glass_components.dart \
            flutter/lib/features/conversations/presentation/conversation_list_pane.dart \
            flutter/lib/features/home/presentation/messenger_shell.dart \
            flutter/lib/features/messages/presentation/widgets/message_composer.dart \
            flutter/test/phase5_accessibility_desktop_test.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'test: finish phase5 accessibility polish'
          git push origin HEAD:chatgpt/phase-5-accessibility-desktop-polish
