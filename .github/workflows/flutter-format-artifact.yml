name: Flutter formatter artifact

on:
  push:
    branches:
      - refactor/flutter-liquid-glass-2026
    paths:
      - ".github/workflows/flutter-format-artifact.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true
      - name: Format Flutter sources
        run: dart format flutter/lib flutter/test
      - name: Archive formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: chatnu-formatted-flutter
          path: |
            flutter/lib
            flutter/test
          if-no-files-found: error
          retention-days: 1
