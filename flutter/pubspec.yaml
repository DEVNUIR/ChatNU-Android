version: 1.2.0+4

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  dio: ^5.11.0
  enefty_icons: ^1.0.10
  file_picker: ^12.1.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: ^3.4.2
