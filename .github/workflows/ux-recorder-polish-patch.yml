name: Apply recorder UX polish

on:
  push:
    branches:
      - chatgpt/ux-recorder-blue-polish
    paths:
      - ".github/workflows/ux-recorder-polish-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ux-recorder-blue-polish
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true
      - name: Remove obsolete action background parameter
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('flutter/lib/features/messages/presentation/widgets/message_composer.dart')
          text = path.read_text()
          for line in (
              '    this.background,\n',
              '  final Color? background;\n',
              '        backgroundColor: background,\n',
          ):
              if text.count(line) != 1:
                  raise SystemExit(f'expected one match for {line!r}, got {text.count(line)}')
              text = text.replace(line, '', 1)
          path.write_text(text)
          PY
          cd flutter
          dart format lib/features/messages/presentation/widgets/message_composer.dart
      - name: Commit analyzer cleanup
        shell: bash
        run: |
          git config user.name "ChatNU Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add flutter/lib/features/messages/presentation/widgets/message_composer.dart
          git diff --cached --quiet && exit 0
          git commit -m "fix(flutter): remove obsolete recorder action styling"
          git push origin HEAD:chatgpt/ux-recorder-blue-polish
