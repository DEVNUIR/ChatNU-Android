version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: chatnu-db
    environment:
      POSTGRES_DB: chatnu
      POSTGRES_USER: chatnu_admin
      POSTGRES_PASSWORD: devnu_secure_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: chatnu-redis
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: chatnu-api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://chatnu_admin:devnu_secure_password@postgres:5432/chatnu
      REDIS_URL: redis://redis:6379
      DOMAIN: devnu.ir
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis

  livekit:
    image: livekit/livekit-server:v1.5
    container_name: chatnu-livekit
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-60000:50000-60000/udp"

volumes:
  pgdata:
