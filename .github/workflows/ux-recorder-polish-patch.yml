name: Apply recorder UX polish

on:
  push:
    branches:
      - chatgpt/ux-recorder-blue-polish
    paths:
      - ".github/workflows/ux-recorder-polish-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ux-recorder-blue-polish
      - name: Apply focused Flutter UX and E2EE repair patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          # Blue ChatNU identity.
          path = Path('flutter/lib/core/theme/chatnu_theme.dart')
          text = path.read_text()
          text = replace_once(
              text,
              "    accentPrimary: Color(0xFFFFCC00),\n    accentSecondary: Color(0xFFF7F7F7),",
              "    accentPrimary: Color(0xFF168CFF),\n    accentSecondary: Color(0xFF73C6FF),",
              'dark accent',
          )
          text = replace_once(
              text,
              "    accentPrimary: Color(0xFFFFCC00),\n    accentSecondary: Color(0xFF111111),",
              "    accentPrimary: Color(0xFF0B75E5),\n    accentSecondary: Color(0xFF38A9FF),",
              'light accent',
          )
          text = replace_once(
              text,
              "          onPrimary: const Color(0xFF111111),",
              "          onPrimary: Colors.white,",
              'onPrimary',
          )
          path.write_text(text)

          # Familiar, consistent navigation icons and blue selected state.
          path = Path('flutter/lib/features/home/presentation/messenger_shell.dart')
          text = path.read_text()
          for old, new in (
              ('Icons.chat_bubble_rounded', 'Icons.chat_rounded'),
              ('Icons.chat_bubble_outline_rounded', 'Icons.chat_outlined'),
              ('Icons.people_alt_rounded', 'Icons.contacts_rounded'),
              ('Icons.people_alt_outlined', 'Icons.contacts_outlined'),
              ('Icons.tune_rounded', 'Icons.settings_rounded'),
              ('Icons.tune_outlined', 'Icons.settings_outlined'),
          ):
              text = text.replace(old, new)
          text = replace_once(
              text,
              "              backgroundColor: palette.textPrimary,\n              foregroundColor: palette.backgroundElevated,",
              "              backgroundColor: palette.accentPrimary,\n              foregroundColor: Colors.white,",
              'new chat FAB colors',
          )
          text = replace_once(
              text,
              "          color: selected\n              ? palette.glassMedium.withValues(alpha: 0.72)\n              : Colors.transparent,",
              "          color: selected\n              ? palette.accentPrimary.withValues(alpha: 0.12)\n              : Colors.transparent,",
              'phone nav selected background',
          )
          text = text.replace(
              "color: selected ? palette.textPrimary : palette.textMuted,",
              "color: selected ? palette.accentPrimary : palette.textMuted,",
          )
          text = replace_once(
              text,
              "            backgroundColor: selected\n                ? palette.glassMedium.withValues(alpha: 0.78)\n                : Colors.transparent,\n            foregroundColor: selected ? palette.textPrimary : palette.textMuted,",
              "            backgroundColor: selected\n                ? palette.accentPrimary.withValues(alpha: 0.12)\n                : Colors.transparent,\n            foregroundColor: selected ? palette.accentPrimary : palette.textMuted,",
              'desktop nav selected colors',
          )
          path.write_text(text)

          # Recorder interaction: release-to-send, drag-up-to-lock, locked send button,
          # and a real centered video-note preview overlay instead of a 36px composer preview.
          path = Path('flutter/lib/features/messages/presentation/widgets/message_composer.dart')
          text = path.read_text()
          text = replace_once(
              text,
              "  CameraController? _cameraController;\n  StreamSubscription<Amplitude>? _amplitudeSubscription;",
              "  CameraController? _cameraController;\n  OverlayEntry? _videoPreviewOverlay;\n  StreamSubscription<Amplitude>? _amplitudeSubscription;",
              'video overlay field',
          )
          text = replace_once(
              text,
              "    unawaited(_audioRecorder.dispose());\n    unawaited(_disposeCamera());",
              "    unawaited(_audioRecorder.dispose());\n    _removeVideoPreviewOverlay();\n    unawaited(_disposeCamera());",
              'dispose overlay',
          )
          text = text.replace("                          cameraController: _cameraController,\n", "")
          text = text.replace(
              "                          onSend: () =>\n                              unawaited(_finishRecording(cancel: false)),\n",
              "",
          )
          text = replace_once(
              text,
              "                          backgroundColor: palette.textPrimary,\n                          foregroundColor: palette.backgroundElevated,",
              "                          backgroundColor: palette.accentPrimary,\n                          foregroundColor: Colors.white,",
              'composer send colors',
          )
          text = replace_once(
              text,
              "                        enabled: !demo && _recordingSession.isIdle,",
              "                        enabled: !demo && !_finishing,",
              'record button enabled state',
          )
          text = text.replace("                        locked: _recordingSession.isLocked,\n", "")
          text = replace_once(
              text,
              "                        onTap: _toggleRecordMode,",
              "                        onTap: busyRecording\n                            ? () => unawaited(\n                                  _finishRecording(cancel: false),\n                                )\n                            : _toggleRecordMode,",
              'record/send tap behavior',
          )
          text = replace_once(
              text,
              "    setState(() {});\n    await controller.startVideoRecording();",
              "    setState(() {});\n    _showVideoPreviewOverlay(controller);\n    await controller.startVideoRecording();",
              'show centered video preview',
          )

          marker = "  Future<void> _disposeCamera() async {\n"
          overlay_methods = r'''  void _showVideoPreviewOverlay(CameraController controller) {
    _removeVideoPreviewOverlay();
    final overlay = Overlay.of(context, rootOverlay: true);
    _videoPreviewOverlay = OverlayEntry(
      builder: (overlayContext) {
        final palette = overlayContext.chatNu;
        final shortestSide = MediaQuery.sizeOf(overlayContext).shortestSide;
        final diameter = (shortestSide * 0.42).clamp(168.0, 240.0).toDouble();
        return IgnorePointer(
          child: Positioned.fill(
            child: SafeArea(
              child: Center(
                child: Container(
                  width: diameter,
                  height: diameter,
                  padding: const EdgeInsets.all(4),
                  decoration: BoxDecoration(
                    shape: BoxShape.circle,
                    color: palette.backgroundElevated,
                    border: Border.all(color: palette.accentPrimary, width: 3),
                    boxShadow: <BoxShadow>[
                      BoxShadow(
                        color: Colors.black.withValues(alpha: 0.2),
                        blurRadius: 28,
                        offset: const Offset(0, 12),
                      ),
                      BoxShadow(
                        color: palette.accentPrimary.withValues(alpha: 0.16),
                        blurRadius: 32,
                      ),
                    ],
                  ),
                  child: ClipOval(
                    child: FittedBox(
                      fit: BoxFit.cover,
                      child: SizedBox(
                        width: controller.value.previewSize?.height ?? 1,
                        height: controller.value.previewSize?.width ?? 1,
                        child: CameraPreview(controller),
                      ),
                    ),
                  ),
                ),
              ),
            ),
          ),
        );
      },
    );
    overlay.insert(_videoPreviewOverlay!);
  }

  void _removeVideoPreviewOverlay() {
    _videoPreviewOverlay?.remove();
    _videoPreviewOverlay = null;
  }

'''
          text = replace_once(text, marker, overlay_methods + marker, 'overlay methods')
          text = replace_once(
              text,
              "  Future<void> _disposeCamera() async {\n    final camera = _cameraController;",
              "  Future<void> _disposeCamera() async {\n    _removeVideoPreviewOverlay();\n    final camera = _cameraController;",
              'remove overlay with camera',
          )

          text = text.replace("    required this.cameraController,\n", "")
          text = text.replace("    required this.onSend,\n", "")
          text = text.replace("  final CameraController? cameraController;\n", "")
          text = text.replace("  final VoidCallback onSend;\n", "")
          text = replace_once(
              text,
              "    final camera = cameraController;\n    final previewReady =\n        session.mode == ChatNuRecordingMode.video &&\n        camera != null &&\n        camera.value.isInitialized;\n",
              "",
              'remove composer camera preview state',
          )
          old_preview = r'''          if (previewReady)
            ClipOval(
              child: SizedBox.square(
                dimension: 36,
                child: FittedBox(
                  fit: BoxFit.cover,
                  child: SizedBox(
                    width: camera.value.previewSize?.height ?? 1,
                    height: camera.value.previewSize?.width ?? 1,
                    child: CameraPreview(camera),
                  ),
                ),
              ),
            )
          else if (session.phase == ChatNuRecordingPhase.arming)
            SizedBox.square(
              dimension: 34,
              child: Padding(
                padding: const EdgeInsets.all(8),
                child: CircularProgressIndicator(
                  strokeWidth: 2,
                  color: foreground,
                ),
              ),
            )
          else
'''
          new_preview = r'''          if (session.phase == ChatNuRecordingPhase.arming)
            SizedBox.square(
              dimension: 34,
              child: Padding(
                padding: const EdgeInsets.all(8),
                child: CircularProgressIndicator(
                  strokeWidth: 2,
                  color: foreground,
                ),
              ),
            )
          else if (session.mode == ChatNuRecordingMode.video)
            Container(
              width: 34,
              height: 34,
              decoration: BoxDecoration(
                shape: BoxShape.circle,
                color: palette.accentPrimary.withValues(alpha: 0.12),
              ),
              child: Icon(
                Icons.videocam_rounded,
                size: 19,
                color: foreground,
              ),
            )
          else
'''
          text = replace_once(text, old_preview, new_preview, 'recording status preview')
          send_action = r'''            _RecordingAction(
              tooltip: strings.send,
              icon: Icons.arrow_upward_rounded,
              foreground: palette.backgroundElevated,
              background: palette.accentPrimary,
              onPressed: onSend,
            ),
'''
          text = replace_once(text, send_action, "", 'duplicate locked send action')
          text = text.replace("    required this.locked,\n", "")
          text = text.replace("  final bool locked;\n", "")
          text = replace_once(
              text,
              "    final tooltip = mode == ChatNuRecordingMode.voice\n        ? (strings.isPersian\n              ? 'صدا؛ لمس برای ویدیو، نگه‌دارید برای ضبط'\n              : 'Voice; tap for video, hold to record')\n        : (strings.isPersian\n              ? 'ویدیو؛ لمس برای صدا، نگه‌دارید برای ضبط'\n              : 'Video; tap for voice, hold to record');",
              "    final tooltip = recording\n        ? strings.send\n        : mode == ChatNuRecordingMode.voice\n        ? (strings.isPersian\n              ? 'صدا؛ لمس برای ویدیو، نگه‌دارید برای ضبط'\n              : 'Voice; tap for video, hold to record')\n        : (strings.isPersian\n              ? 'ویدیو؛ لمس برای صدا، نگه‌دارید برای ضبط'\n              : 'Video; tap for voice, hold to record');",
              'record button tooltip',
          )
          text = replace_once(
              text,
              "          onTap: enabled ? onTap : null,\n          onLongPressStart: enabled ? onLongPressStart : null,\n          onLongPressMoveUpdate: enabled ? onLongPressMoveUpdate : null,\n          onLongPressEnd: enabled ? onLongPressEnd : null,",
              "          onTap: enabled ? onTap : null,\n          onLongPressStart: enabled && !recording ? onLongPressStart : null,\n          onLongPressMoveUpdate:\n              enabled && !recording ? onLongPressMoveUpdate : null,\n          onLongPressEnd: enabled && !recording ? onLongPressEnd : null,",
              'record gestures while active',
          )
          old_color = r'''              color: recording
                  ? cancelArmed
                        ? palette.destructive
                        : locked
                        ? palette.textPrimary
                        : palette.accentPrimary
                  : palette.glassWeak,
'''
          new_color = r'''              color: recording
                  ? cancelArmed
                        ? palette.destructive
                        : palette.accentPrimary
                  : palette.glassWeak,
'''
          text = replace_once(text, old_color, new_color, 'record button active color')
          old_icon = r'''            child: Icon(
              locked ? Icons.lock_rounded : icon,
              key: ValueKey<String>('${mode.name}-$locked'),
              size: 22,
              color: recording
                  ? locked
                        ? palette.backgroundElevated
                        : Colors.white
                  : palette.textPrimary,
            ),
'''
          new_icon = r'''            child: Icon(
              recording
                  ? cancelArmed
                        ? Icons.close_rounded
                        : Icons.send_rounded
                  : icon,
              key: ValueKey<String>(
                '${mode.name}-$recording-$cancelArmed',
              ),
              size: 22,
              color: recording ? Colors.white : palette.textPrimary,
            ),
'''
          text = replace_once(text, old_icon, new_icon, 'record button send icon')
          path.write_text(text)

          # E2EE self-heal for the current device only. Never bypass another member's missing key.
          path = Path('flutter/lib/features/home/data/messenger_repository.dart')
          text = path.read_text()
          text = replace_once(
              text,
              "    final keys = await _api.conversationKeys(conversationId);",
              "    final keys = await _conversationKeysWithIdentityRepair(conversationId);",
              'conversation key repair call',
          )
          marker = "  Future<ChatNuConversation> _conversationFromDto(ConversationDto dto) async {\n"
          repair_method = r'''  Future<ConversationKeysResponse> _conversationKeysWithIdentityRepair(
    String conversationId,
  ) async {
    var keys = await _api.conversationKeys(conversationId);
    final session = _vault.session;
    if (session == null || !keys.missingUserIds.contains(session.user.id)) {
      return keys;
    }

    final publicKey = await _e2ee.publicKeyBase64(session.cryptoAccount);
    await _api.updateIdentityKey(publicKey);
    keys = await _api.conversationKeys(conversationId);
    return keys;
  }

'''
          text = replace_once(text, marker, repair_method + marker, 'identity repair method')
          text = replace_once(
              text,
              "        'Some members must open an E2EE-capable ChatNU client before encrypted messages can be sent.',",
              "        'Encrypted messaging is waiting for another conversation member to register an E2EE device. Ask them to open the latest ChatNU and reconnect.',",
              'E2EE missing-key message',
          )
          path.write_text(text)
          PY

          git diff --check
          git status --short
      - name: Commit focused polish
        shell: bash
        run: |
          git config user.name "ChatNU Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add flutter/lib/core/theme/chatnu_theme.dart \
                  flutter/lib/features/home/presentation/messenger_shell.dart \
                  flutter/lib/features/messages/presentation/widgets/message_composer.dart \
                  flutter/lib/features/home/data/messenger_repository.dart
          git diff --cached --quiet && exit 0
          git commit -m "feat(flutter): polish recorder UX and blue identity"
          git push origin HEAD:chatgpt/ux-recorder-blue-polish
