name: Apply recorder UX polish

on:
  push:
    branches:
      - chatgpt/ux-recorder-blue-polish
    paths:
      - ".github/workflows/ux-recorder-polish-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ux-recorder-blue-polish
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true
      - name: Canonicalize changed Dart sources
        working-directory: flutter
        run: dart format lib/features/home/presentation/messenger_shell.dart lib/features/messages/presentation/widgets/message_composer.dart
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "ChatNU Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add flutter/lib/features/home/presentation/messenger_shell.dart \
                  flutter/lib/features/messages/presentation/widgets/message_composer.dart
          git diff --cached --quiet && exit 0
          git commit -m "style(flutter): canonicalize recorder UX polish"
          git push origin HEAD:chatgpt/ux-recorder-blue-polish
