          text = replace_once(
              text,
              """    return IconButton(\n      tooltip: tooltip,\n      onPressed: onPressed,\n      visualDensity: VisualDensity.compact,\n      constraints: const BoxConstraints.tightFor(width: 38, height: 38),\n      style: IconButton.styleFrom(\n        foregroundColor: foreground,\n        backgroundColor: background,\n      ),""",
              """    return IconButton(\n      tooltip: tooltip,\n      onPressed: onPressed,\n      style: IconButton.styleFrom(\n        minimumSize: const Size.square(ChatNuSizing.minTouchTarget),\n        tapTargetSize: MaterialTapTargetSize.padded,\n        foregroundColor: foreground,\n        backgroundColor: background,\n      ),""",
              'recording action 48dp',
          )
          path.write_text(text)

          # Phase 5 focused automated coverage.
          Path('flutter/test/phase5_accessibility_desktop_test.dart').write_text(r'''import 'dart:ui';

import 'package:chatnu/app/chatnu_app.dart';
