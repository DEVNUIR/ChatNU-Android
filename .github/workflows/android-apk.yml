name: Android APK

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Bootstrap Android host and icon
        run: ./tool/bootstrap_android.sh

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Verify ChatNU launcher icon
        run: |
          test -f android/app/src/main/res/drawable/ic_launcher_chatnu.xml
          grep -q '@drawable/ic_launcher_chatnu' android/app/src/main/AndroidManifest.xml
          grep -q 'android:label="ChatNU"' android/app/src/main/AndroidManifest.xml

      - name: Build release APK
        run: flutter build apk --release

      - name: Stage APK
        run: cp build/app/outputs/flutter-apk/app-release.apk ChatNU-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatNU-Android-APK
          path: ChatNU-release.apk
          if-no-files-found: error
          retention-days: 14
