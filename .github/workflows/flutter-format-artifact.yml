name: Flutter formatter artifact

on:
  push:
    branches:
      - refactor/flutter-liquid-glass-2026
    paths:
      - ".github/workflows/flutter-format-artifact.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true
      - name: Format Flutter sources
        run: |
          cd flutter
          dart format lib test
      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter/lib flutter/test
          if ! git diff --cached --quiet; then
            git commit -m "style(flutter): format regression coverage"
            git push
          fi
      - name: Archive formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: chatnu-formatted-flutter
          path: |
            flutter/lib
            flutter/test
          if-no-files-found: error
          retention-days: 1
